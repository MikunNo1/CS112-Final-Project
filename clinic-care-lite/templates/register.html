<!DOCTYPE html>
<html>
<head>
    <title>Register - Clinic Care</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body class="dark-theme">
    <div class="container py-5" style="max-width: 400px;"></div>

        <h1>Welcome to Clinic Care</h1>
        <h2>Register below</h2>
        <form method="POST" action="/register">
            <input type="text" name="user_id" placeholder="User ID" class="form-control mb-3" required>
            <input type="text" name="name" placeholder="Full Name" class="form-control mb-3" required>
            <input type="email" name="email" placeholder="Email" class="form-control mb-3" required>
            <input type="password" name="password" placeholder="Password" class="form-control mb-3" required>
            <select name="role" class="form-select mb-3" required>
                <option value="clinician">Clinician</option>
                <option value="patient">Patient</option>
            </select>
            <button type="submit" class="btn btn-primary">Register</button>
        </form>
     </div>
    {% if error %}
    <p class="text-danger">{{ error }}</p>
    {% endif %}
    <h2>Fill in your details to register!</h2>
</body>
</html>
